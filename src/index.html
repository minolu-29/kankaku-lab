<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>感覚ラボ｜あなたの感覚は何%正確？</title>
<!--WEB-HEAD-->
<meta name="description" content="色あわせ・角度・リズム・時間感覚など、感覚の精度を測る10本のミニゲーム。結果は画像でシェアできます。">
<meta name="theme-color" content="#14121c">
<meta property="og:type" content="website">
<meta property="og:title" content="感覚ラボ｜あなたの感覚は何%正確？">
<meta property="og:description" content="あなたの感覚は何%正確？10種類の感覚テスト。">
<meta property="og:image" content="%SITE_URL%og.png">
<meta property="og:url" content="%SITE_URL%">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<!--/WEB-HEAD-->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Unbounded:wght@500;700&display=swap">
<style>/* 感覚ラボ: 夜の実験室。濃い紫がかった黒に、細い線と発光する色。数字は幾何学的な欧文フォント */
:root{
  --bg:#14121c; --paper:#1d1a28; --ink:#f2eee6; --muted:#a49fb6; --soft:#262236;
  --line:#3b3650; --shadow:transparent; --bw:1.5px; --on-gc:#14121c;
  --accent:#ffb86b; --ok:#5ee0b5; --ng:#ff6b7a;
  --pat:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1.4px); --pat-size:18px 18px;
  --f-display:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --r:20px; color-scheme:dark;
}

/* 共通エンジンの見た目。色・書体・線の太さは各アプリの theme.css が :root で決める */
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background-color:var(--bg);background-image:var(--pat);background-size:var(--pat-size);
  color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-tap-highlight-color:transparent;
  padding-inline:12px;padding-block:calc(14px + env(safe-area-inset-top,0px)) calc(28px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;line-height:1.2;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

/* ホーム */
.hero{display:flex;flex-direction:column;gap:6px;padding:4px 4px 2px}
.hero .tag{align-self:flex-start;background:var(--ink);color:var(--paper);font-weight:800;font-size:12px;letter-spacing:.08em;padding:2px 12px;border-radius:999px}
.hero h1{font-size:clamp(40px,13vw,60px);letter-spacing:.02em}
.hero h1 span{color:var(--accent)}
.hero p{color:var(--muted);font-weight:700;font-size:14px}
.shelf{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:480px){.shelf{grid-template-columns:repeat(3,minmax(0,1fr))}}
.card{cursor:pointer;text-align:left;background:var(--paper);border:var(--bw) solid var(--line);border-radius:16px;box-shadow:4px 4px 0 var(--shadow);
  padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0;transition:transform .08s,box-shadow .08s}
.card:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--shadow)}
.badge{width:100%;aspect-ratio:1.6;border-radius:11px;border:2px solid var(--line);display:grid;place-items:center;
  font-family:var(--f-display);font-size:clamp(30px,9vw,44px);color:var(--on-gc);position:relative;overflow:hidden}
.badge small{position:absolute;top:6px;left:8px;font-family:var(--f-body);font-weight:800;font-size:11px;background:var(--paper);border:1.5px solid var(--line);border-radius:999px;padding:0 7px;line-height:1.6}
.card b{font-weight:800;font-size:15px;line-height:1.3}
.card .best{font-size:12px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.foot{font-size:12px;color:var(--muted);text-align:center}

/* プレイ画面 */
.bar{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}
.ib{cursor:pointer;background:var(--paper);border:var(--bw) solid var(--line);border-radius:999px;box-shadow:2px 2px 0 var(--shadow);font-weight:800;font-size:14px;padding:5px 12px;white-space:nowrap}
.bar h2{font-size:20px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud{display:flex;justify-content:space-between;gap:10px;font-weight:800;font-variant-numeric:tabular-nums;padding:0 4px;min-height:1.6em}
.hud b{font-family:var(--f-display);font-weight:400;font-size:22px;line-height:1}
#stage-wrap{position:relative;border:var(--bw) solid var(--line);border-radius:var(--r);box-shadow:4px 4px 0 var(--shadow);background:var(--paper);overflow:hidden;flex:1;min-height:0;display:flex;flex-direction:column}
#stage{position:relative;width:100%;flex:1;min-height:0;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden}
#stage canvas{display:block;width:100%;height:100%}
.shake{animation:shake .28s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}

.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:20px;
  background:color-mix(in srgb,var(--paper) 93%,transparent);z-index:5}
.ov h2{font-size:30px}
.ov .how{font-weight:700;max-width:30ch;color:var(--muted)}
.ov .score{font-family:var(--f-display);font-size:clamp(52px,17vw,84px);line-height:1;font-variant-numeric:tabular-nums}
.ov .rank{font-family:var(--f-display);font-size:22px;color:var(--on-gc);background:var(--gc,#ffcf4a);border:var(--bw) solid var(--line);border-radius:999px;padding:4px 18px;box-shadow:3px 3px 0 var(--shadow)}
.ov .newbest{font-weight:800;color:var(--paper);background:var(--accent);border-radius:999px;padding:2px 12px;font-size:13px;letter-spacing:.06em}
.ov .sub{font-weight:700;color:var(--muted);font-size:14px}
.btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.btn{cursor:pointer;font-weight:800;font-size:17px;background:var(--gc,#ffcf4a);border:var(--bw) solid var(--line);border-radius:999px;padding:11px 26px;box-shadow:3px 3px 0 var(--shadow);text-decoration:none;color:var(--on-gc);display:inline-flex;align-items:center;gap:6px}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.btn.sub{background:var(--paper);color:var(--ink);font-size:15px;padding:9px 18px}
.btn.dark{background:var(--ink);color:var(--paper)}
.next{font-size:13px;font-weight:700;color:var(--muted)}
.next button{cursor:pointer;background:none;border:0;padding:0;font-weight:800;color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.langs a{color:var(--muted);font-size:13px;font-weight:700;padding:4px 8px}

/* シェア */
.sheet-ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center;padding:12px}
.sheet{width:100%;max-width:440px;max-height:92vh;overflow:auto;background:var(--paper);border:var(--bw) solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px;margin-bottom:env(safe-area-inset-bottom,0px)}
.sheet img{width:100%;border:2px solid var(--line);border-radius:12px}
.sheet .note{font-size:12px;color:var(--muted);text-align:center}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);font-weight:800;padding:8px 16px;border-radius:999px;z-index:60;font-size:14px}

/* ゲーム内で使う共通パーツ */
.pop{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font-family:var(--f-display);font-size:34px;pointer-events:none;white-space:nowrap;
  color:var(--ink);text-shadow:2px 2px 0 var(--paper),-2px -2px 0 var(--paper),2px -2px 0 var(--paper),-2px 2px 0 var(--paper);animation:pop .7s ease-out forwards;z-index:4}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}100%{opacity:0;transform:translate(-50%,-90%) scale(1)}}
.grid{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(calc(100% - 24px),calc(var(--sh,400px) - 24px));aspect-ratio:1;display:grid;gap:8px}
.cell{cursor:pointer;border:var(--bw) solid var(--line);border-radius:12px;background:var(--paper);display:grid;place-items:center;
  font-family:var(--f-display);font-size:clamp(18px,6vw,30px);min-width:0;min-height:0;padding:0;box-shadow:2px 2px 0 var(--shadow);transition:transform .06s,background .12s}
.cell:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;text-align:center}
.big{font-family:var(--f-display);font-size:clamp(44px,15vw,72px);line-height:1.05;font-variant-numeric:tabular-nums}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.choice{cursor:pointer;border:var(--bw) solid var(--line);border-radius:16px;box-shadow:3px 3px 0 var(--shadow);background:var(--paper);
  font-family:var(--f-display);font-size:clamp(22px,7vw,34px);padding:18px 8px;min-width:0}
.choice:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.hint{font-weight:700;color:var(--muted)}

/* プレイ中は画面いっぱい */
#play{position:fixed;inset:0;z-index:10;max-width:none;display:flex;flex-direction:column;gap:6px;
  background-color:var(--bg);background-image:var(--pat);background-size:var(--pat-size);
  padding:calc(8px + env(safe-area-inset-top,0px)) 10px calc(12px + env(safe-area-inset-bottom,0px))}
#play>*{width:100%;max-width:640px;margin-inline:auto}
#play .bar h2{font-size:18px}
#play .hud{min-height:1.5em}
body.playing{overflow:hidden;overscroll-behavior:none}

h1,h2,h3,.badge,.ov .score,.ov .rank,.big,.hud b,.choice,.cell{font-weight:900}
.hero h1{font-size:clamp(40px,12vw,58px);letter-spacing:-.01em}
.ov .score,.hud b,.big{font-family:"Unbounded","Zen Kaku Gothic New",sans-serif;font-weight:700;letter-spacing:-.02em}
.card{border-radius:18px}
.badge{border:none;border-radius:14px;aspect-ratio:1.5}
.badge small{background:rgba(20,18,28,.85);color:var(--ink);border:none}
.card:active{transform:scale(.97)}
.btn,.choice,.cell{box-shadow:none}
.btn:active,.choice:active,.cell:active{transform:scale(.96)}
.ov{background:color-mix(in srgb,var(--paper) 94%,transparent)}
.ov .rank{border:none}
.ib{box-shadow:none}
.hero .tag{background:var(--accent);color:var(--on-gc)}
body{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.on-portal .foot{display:none}
.langs{text-align:center;margin:0}
.langs button{cursor:pointer;background:none;border:0;padding:4px 8px;color:var(--muted);font-weight:700;font-size:13px;text-decoration:underline;text-underline-offset:3px}
</style>
<!--PLATFORM-->
</head>
<body>
<div class="wrap">
  <section id="hub" class="wrap" style="max-width:none">
    <header class="hero">
      <span class="tag">1回1分・感覚の精度テスト</span>
      <h1>感覚<span>ラボ</span></h1>
      <p>色、角度、リズム、時間。自分の感覚がどこまで正確か、10種類のテストで確かめよう。</p>
    </header>
    <div class="shelf" id="shelf"></div>
    <p class="foot">記録はこの端末のブラウザにだけ保存されます</p>
    <p class="langs"><button type="button" id="lang">English</button><!--PRIVACY-LINK--></p>
  </section>

  <section id="play" hidden>
    <div class="bar">
      <button class="ib" type="button" id="back">‹ ホーム</button>
      <h2 id="g-title"></h2>
      <button class="ib" type="button" id="mute" aria-pressed="true">音オン</button>
    </div>
    <div class="hud" aria-live="polite"><span id="hud-l"></span><span id="hud-r"></span></div>
    <div id="stage-wrap">
      <div id="stage"></div>
      <div class="ov" id="ov" hidden></div>
    </div>
  </section>
</div>

<script>
(window.PLATFORM && window.PLATFORM.init ? window.PLATFORM.init() : Promise.resolve()).then(() => {
/* 言語: ?lang=en / 前回の選択 / ブラウザの言語 の順で決める。日本語以外は英語 */
const LANG = (() => {
  try { const q = new URLSearchParams(location.search).get("lang"); if (q) return q === "ja" ? "ja" : "en"; } catch (e) {}
  try { const s = localStorage.getItem("lang"); if (s) return s; } catch (e) {}
  if (window.PLATFORM && window.PLATFORM.lang) return window.PLATFORM.lang;
  return /^ja\b/i.test(navigator.language || "") ? "ja" : "en";
})();
const EN = LANG !== "ja";
const tr = (ja, en) => EN ? en : ja;
/* HTMLに直接書いてある文字の英語版と、言語の切り替え */
(() => {
  const q = sel => document.querySelector(sel);
  if (EN) {
    document.documentElement.lang = "en";
    q(".hero .tag").textContent = "1 minute each · Test your senses";
    q(".hero h1").innerHTML = "Sense <span>Lab</span>";
    q(".hero p").textContent = "Color, angle, rhythm, time. Find out how accurate your senses really are with 10 tests.";
    q(".foot").textContent = "Your records are saved only in this browser";
    q("#back").textContent = "‹ Home";
  }
  const btn = q("#lang");
  btn.textContent = EN ? "日本語" : "English";
  btn.onclick = () => {
    const next = EN ? "ja" : "en";
    try { localStorage.setItem("lang", next); } catch (e) {}
    const u = new URL(location.href); u.searchParams.set("lang", next); location.replace(u.href);
  };
})();
const BRAND = {
  name: tr("感覚ラボ", "Sense Lab"), title: tr("感覚ラボ｜あなたの感覚は何%正確？", "Sense Lab | How accurate are your senses?"), hashtag: tr("感覚ラボ", "SenseLab"), slug: "kankaku", prefix: "kl-",
  fd: '"Zen Kaku Gothic New","Hiragino Sans",sans-serif', fb: '"Zen Kaku Gothic New","Hiragino Sans",sans-serif',
  c: { bg: "#1d1a28", ink: "#f2eee6", muted: "#a49fb6", line: "#3b3650", accent: "#ffb86b", deep: "#14121c" },
  card: { bg: "#14121c", dot: "rgba(255,255,255,.06)", panel: "#1d1a28", ink: "#f2eee6", glyphInk: "#14121c", muted: "#a49fb6", foot: "#ffb86b", font: '"Zen Kaku Gothic New","Hiragino Sans",sans-serif' },
};

/* 共通ゲームエンジン（BRANDで名前・色を差し替え）: ゲーム登録、プレイ画面、スコア保存、結果画像、効果音 */
const $ = (s, r = document) => r.querySelector(s);
const GAMES = [];
const game = def => GAMES.push(def);
const rnd = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const PF = window.PLATFORM || {};
const _ls = () => PF.storage || localStorage;
const store = (k, v) => { try { if (v === undefined) return JSON.parse(_ls().getItem(k) || "null"); _ls().setItem(k, JSON.stringify(v)); } catch (e) { return null; } };
const adGate = fn => PF.midgame ? PF.midgame(fn) : fn();
const track = (name, params) => { try { PF.track && PF.track(name, params); } catch (e) {} };

/* ---------- 効果音 ---------- */
let AC = null, muted = !!store(BRAND.prefix + "mute");
function beep(freq = 660, dur = 0.08, type = "sine", vol = 0.12) {
  if (muted || PF.adPlaying) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === "suspended") AC.resume();
    const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(AC.destination); o.start(t); o.stop(t + dur + 0.02);
  } catch (e) {}
}
const sfx = {
  ok: (n = 0) => beep(523 * Math.pow(2, Math.min(n, 24) / 12), 0.09, "triangle"),
  ng: () => beep(150, 0.18, "square", 0.08),
  tick: () => beep(900, 0.03, "sine", 0.06),
  over: () => { beep(330, 0.12, "triangle"); setTimeout(() => beep(220, 0.25, "triangle"), 120); },
  win: () => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, 0.12, "triangle"), i * 90)),
};
const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

function toast(msg) {
  let t = $(".toast");
  if (!t) { t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); }
  t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2000);
}

/* ---------- ベスト記録 ---------- */
const bestOf = g => store(BRAND.prefix + "best-" + g.id);
function saveBest(g, s) {
  const b = bestOf(g);
  const better = b === null || (g.lower ? s < b : s > b);
  if (better) store(BRAND.prefix + "best-" + g.id, s);
  return better;
}
const rankOf = (g, s) => (g.lower ? g.ranks.find(r => s <= r[0]) : g.ranks.find(r => s >= r[0])) || g.ranks[g.ranks.length - 1];

/* ---------- ホーム ---------- */
function renderHub() {
  $("#shelf").innerHTML = GAMES.map((g, i) => {
    const b = bestOf(g);
    return tr(`<button class="card" type="button" data-g="${g.id}">
      <span class="badge" style="background:${g.color}"><small>${String(i + 1).padStart(2, "0")}</small>${g.glyph}</span>
      <b>${esc(g.name)}</b><span class="best">${b === null ? "まだ遊んでない" : "ベスト " + esc(g.fmt(b))}</span></button>`, `<button class="card" type="button" data-g="${g.id}">
      <span class="badge" style="background:${g.color}"><small>${String(i + 1).padStart(2, "0")}</small>${g.glyph}</span>
      <b>${esc(g.name)}</b><span class="best">${b === null ? "Not played yet" : "Best " + esc(g.fmt(b))}</span></button>`);
  }).join("");
}
$("#shelf").addEventListener("click", e => { const c = e.target.closest("[data-g]"); if (c) go(c.dataset.g); });

/* ---------- プレイ画面 ---------- */
let cur = null, ctx = null;
function stageSize() {
  const st = $("#stage");
  st.style.setProperty("--sh", (st.clientHeight || 500) + "px");
}
function go(id) {
  const g = GAMES.find(x => x.id === id);
  if (!g) { home(); return; }
  cur = g; if (ctx) ctx.kill();
  try { if (location.hash !== "#" + id) history.replaceState(null, "", "#" + id); } catch (e) {}
  $("#hub").hidden = true; $("#play").hidden = false; document.body.classList.add("playing");
  document.documentElement.style.setProperty("--gc", g.color);
  $("#g-title").textContent = g.name; document.title = g.name + tr("｜", " | ") + BRAND.name;
  $("#stage").innerHTML = ""; hud("", ""); stageSize();
  const b = bestOf(g);
  const ov = $("#ov");
  ov.innerHTML = tr(`<h2>${esc(g.name)}</h2><p class="how">${g.how}</p>
    ${b === null ? "" : `<p class="sub">ベスト ${esc(g.fmt(b))}</p>`}
    <button class="btn" type="button" id="start">スタート</button>`, `<h2>${esc(g.name)}</h2><p class="how">${g.how}</p>
    ${b === null ? "" : `<p class="sub">Best ${esc(g.fmt(b))}</p>`}
    <button class="btn" type="button" id="start">Start</button>`);
  ov.hidden = false; $("#start").onclick = start; $("#start").focus({ preventScroll: true });
  window.scrollTo(0, 0);
}
function home() {
  if (ctx) ctx.kill(); ctx = null; cur = null;
  try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
  document.title = BRAND.title;
  $("#play").hidden = true; $("#hub").hidden = false; document.body.classList.remove("playing"); renderHub();
}
function hud(l, r) { $("#hud-l").innerHTML = l; $("#hud-r").innerHTML = r; }

function start() {
  if (ctx) ctx.kill();
  const g = cur, stage = $("#stage");
  stage.innerHTML = ""; $("#ov").hidden = true; stageSize();
  beep(1, 0.001, "sine", 0.0001); // 音を使えるようにする
  if (PF.gameplayStart) PF.gameplayStart();

    on(el, ev, fn, opt) { el.addEventListener(ev, fn, opt); subs.push(() => el.removeEventListener(ev, fn, opt)); },
    after(ms, fn) { const t = setTimeout(() => alive && fn(), ms); subs.push(() => clearTimeout(t)); return t; },

    get alive() { return alive; },

}

/* N回の精度テストをまとめて回す。runRound(i, done) の中で done(精度%) を呼ぶ */
function rounds(c, N, runRound) {
  const res = []; let i = 0;
  const upd = () => c.hud(tr(`<b>${Math.min(i + 1, N)}</b> / ${N} 回`, `Round <b>${Math.min(i + 1, N)}</b> / ${N}`), res.length ? tr(`平均 <b>${avg(res).toFixed(1)}</b>%`, `Avg <b>${avg(res).toFixed(1)}</b>%`) : "");
  const next = () => {
    upd();
    runRound(i, a => {
      a = clamp(a, 0, 100); res.push(a); i++; upd();
      a >= 95 ? c.sfx.ok(12) : a >= 85 ? c.sfx.ok(5) : c.sfx.ng();
      if (i >= N) c.after(1300, () => c.end(Math.round(avg(res) * 10) / 10)); else c.after(1300, next);
    });
  };
  next();
}

    let phase = "show", target = [0, 0, 0], pick = null, pickXY = null, tXY = null, msg = "", done = null, t0 = 0;
    const dist = (a, b) => { const r = (a[0] + b[0]) / 2, dr = a[0] - b[0], dg = a[1] - b[1], db = a[2] - b[2]; return Math.sqrt((2 + r / 256) * dr * dr + 4 * dg * dg + (2 + (255 - r) / 256) * db * db); };

      else { const s = R * .9, t = s * rnd(.35, .55); const L = [[0, 0], [s, 0], [s, t], [t, t], [t, s * 1.4], [0, s * 1.4]]; const ca = Math.cos(rot), sa = Math.sin(rot); pts = L.map(([u, v]) => [u - s / 2, v - s * .7]).map(([u, v]) => [cx + u * ca - v * sa, cy + u * sa + v * ca]); }

/* ---------- 05 テンポキープ ---------- */
game({
  id: "tempo", name: tr("テンポキープ", "Keep the Tempo"), glyph: "♩", color: "#5ee0b5",
  how: tr("4回光るリズムを感じたら、そのまま同じテンポで8回タップを続けよう。途中から何も見えなくなるよ。3回の平均。", "Feel the rhythm of 4 flashes, then keep tapping 8 times at the same tempo with no guide. Average of 3 rounds."),
  fmt: pct, ranks: ACC_RANKS(96, 93, 89, 83, 74),
  play(c) {
    const { x, W, H } = c.canvas();
    let T = 0.5, phase = "listen", taps = [], beat0 = 0, pulse = 0, done = null, msg = "";
    rounds(c, 3, (i, fin) => {
      T = 60 / ri(78, 140); taps = []; msg = ""; phase = "listen"; done = fin; beat0 = performance.now() + 500;
      for (let k = 0; k < 4; k++) c.after(500 + k * T * 1000, () => { pulse = 1; beep(880, 0.06, "sine", .12); });
      c.after(500 + 3.5 * T * 1000, () => { if (phase === "listen") phase = "tap"; });
    });
    c.on(c.stage, "pointerdown", e => {
      e.preventDefault(); if (phase !== "tap" && phase !== "listen") return;
      if (phase === "listen") return;
      taps.push(performance.now()); c.sfx.tick();
      if (taps.length >= 9) {
        phase = "result";
        const iv = taps.slice(1).map((t, k) => (t - taps[k]) / 1000);
        const e2 = avg(iv.map(v => Math.abs(v - T) / T));
        const drift = (avg(iv) - T) / T * 100;
        msg = tr(`BPM ${Math.round(60 / T)} → ${Math.round(60 / avg(iv))}${Math.abs(drift) > 3 ? (drift > 0 ? "（遅れぎみ）" : "（走りぎみ）") : ""}`, `BPM ${Math.round(60 / T)} → ${Math.round(60 / avg(iv))}${Math.abs(drift) > 3 ? (drift > 0 ? " (dragging)" : " (rushing)") : ""}`);
        done(100 - e2 * 220);
      }
    });
    c.loop(dt => {
      x.fillStyle = CC.bg; x.fillRect(0, 0, W, H);
      const cx = W / 2, cy = H * .45, R = Math.min(W, H) * .18;
      x.strokeStyle = CC.line; x.lineWidth = 3; x.beginPath(); x.arc(cx, cy, R, 0, 7); x.stroke();
      if (pulse > 0) { x.fillStyle = `rgba(94,224,181,${pulse})`; x.beginPath(); x.arc(cx, cy, R * (1 + (1 - pulse) * .3), 0, 7); x.fill(); pulse -= dt * 3; }

      if (phase === "tap") { label(x, tr(`同じテンポでタップ（${Math.max(0, 9 - taps.length)}）`, `Tap at the same tempo (${Math.max(0, 9 - taps.length)})`), cx, cy + R + 40, 16, CC.ink); }

    });
  },
});

/* ---------- 08 大小の見きわめ ---------- */
game({
  id: "jnd", name: tr("ちがいの限界", "Spot the Difference"), glyph: "差", color: "#ff7a59", lower: true,
  how: tr("大きいほうをタップ。正解するたびに差が小さくなるよ。3回まちがえると終わり。どこまで小さな差を見抜ける？", "Tap the bigger one. The difference shrinks each time you're right. 3 misses and you're out. How small a difference can you see?"),
  fmt: s => tr("差", "Diff ") + s.toFixed(1) + "%",
  ranks: [[1.5, tr("ミクロの目", "Microscope eyes")], [3, tr("鋭い目", "Sharp eyes")], [5, tr("いい目", "Good eyes")], [8, tr("ふつう", "Average")], [12, tr("おおらか", "Easygoing")], [999, tr("ざっくり派", "Big-picture type")]],
  play(c) {
    const { x, W, H } = c.canvas();
    let d = 20, best = 99, lives = 3, A = null, B = null, big = 0, shape = "c", lock = false;
    const upd = () => c.hud(tr(`差 <b>${d.toFixed(1)}</b>%`, `Diff <b>${d.toFixed(1)}</b>%`), tr(`ミスあと <b>${lives}</b>`, `Lives <b>${lives}</b>`));
    function next() {
      const base = Math.min(W, H) * rnd(.13, .18), s2 = base * (1 + d / 100);
      big = ri(0, 1); shape = pick(["c", "s"]);
      A = { x: W * .27 + rnd(-15, 15), y: H * .5 + rnd(-H * .15, H * .15), r: big === 0 ? s2 : base };
      B = { x: W * .73 + rnd(-15, 15), y: H * .5 + rnd(-H * .15, H * .15), r: big === 1 ? s2 : base };
      lock = false; upd();
    }
    c.on(c.stage, "pointerdown", e => {
      e.preventDefault(); if (lock) return; const [X] = localXY(c, e); const k = X < W / 2 ? 0 : 1; lock = true;
      if (k === big) { best = Math.min(best, d); c.sfx.ok(Math.round(20 - d)); d = Math.max(0.3, d * 0.78); c.after(250, next); }
      else { lives--; c.sfx.ng(); c.shake(); d = Math.min(30, d * 1.3); if (lives <= 0) { c.after(500, () => c.end(Math.round((best > 98 ? 30 : best) * 10) / 10)); } else c.after(500, next); }
    });
    c.loop(() => {
      x.fillStyle = CC.bg; x.fillRect(0, 0, W, H);
      x.strokeStyle = CC.line; x.lineWidth = 1; x.beginPath(); x.moveTo(W / 2, 20); x.lineTo(W / 2, H - 20); x.stroke();
      [A, B].forEach(o => { if (!o) return; x.fillStyle = "#ff7a59"; x.beginPath(); if (shape === "c") x.arc(o.x, o.y, o.r, 0, 7); else x.rect(o.x - o.r * .9, o.y - o.r * .9, o.r * 1.8, o.r * 1.8); x.fill(); });
      label(x, tr("大きいほうをタップ", "Tap the bigger one"), W / 2, H - 26, 14, CC.muted);
    });
    next();
  },
});

/* ---------- 09 ついていけ ---------- */
game({
  id: "trace", name: tr("光についていけ", "Follow the Light"), glyph: "追", color: "#b5a8ff",
  how: tr("光る玉に指をのせて、離れないように追いかけよう。だんだん速く、動きも読みにくくなるよ。", "Put your finger on the glowing orb and follow it. It gets faster and harder to predict."),
  fmt: s => s.toFixed(1) + tr("秒", "s"),
  ranks: [[45, tr("完全シンクロ", "Perfect sync")], [30, tr("動体視力の鬼", "Hawk eyes")], [20, tr("かなりうまい", "Really good")], [13, tr("いい感じ", "Nice")], [7, tr("ふつう", "Average")], [0, tr("置いていかれた", "Left behind")]],
  play(c) {
    const { x, W, H } = c.canvas();
    const R = Math.min(W, H) * .07;
    let on = false, started = false, t = 0, finger = null, off = 0, dead = false, trail = [];
    let px = W / 2, py = H / 2, ph = [rnd(0, 6), rnd(0, 6), rnd(0, 6)];
    c.on(c.stage, "pointerdown", e => { e.preventDefault(); finger = localXY(c, e); on = true; });
    c.on(c.stage, "pointermove", e => { if (on) finger = localXY(c, e); });
    c.on(window, "pointerup", () => { on = false; });
    c.loop(dt => {
      const near = finger && on && Math.hypot(finger[0] - px, finger[1] - py) < R * 1.7;
      if (!started && near) { started = true; c.sfx.ok(3); }
      if (started && !dead) {
        t += dt; const sp = 0.5 + t * 0.045;
        ph[0] += dt * sp * 1.0; ph[1] += dt * sp * 1.37; ph[2] += dt * sp * .53;
        px = W / 2 + Math.sin(ph[0]) * (W / 2 - R - 10) * .9 + Math.sin(ph[2] * 2.3) * W * .04;
        py = H / 2 + Math.sin(ph[1]) * (H / 2 - R - 10) * .85 + Math.cos(ph[2] * 1.7) * H * .04;
        off = near ? 0 : off + dt;
        if (off > 0.35) { dead = true; c.sfx.ng(); c.shake(); c.after(600, () => c.end(Math.round(t * 10) / 10)); }
        c.hud(off > 0 ? tr(`<span style="color:#ff6b7a">はなれてる！</span>`, `<span style="color:#ff6b7a">You let go!</span>`) : tr("ついていってる", "Keeping up"), tr(`<b>${t.toFixed(1)}</b> 秒`, `<b>${t.toFixed(1)}</b> s`));
      }
      trail.push([px, py]); if (trail.length > 18) trail.shift();
      x.fillStyle = CC.bg; x.fillRect(0, 0, W, H);
      trail.forEach((p, i) => { x.fillStyle = `rgba(181,168,255,${i / trail.length * .35})`; x.beginPath(); x.arc(p[0], p[1], R * i / trail.length, 0, 7); x.fill(); });
      const gl = x.createRadialGradient(px, py, 0, px, py, R * 1.8); gl.addColorStop(0, "rgba(181,168,255,.9)"); gl.addColorStop(1, "rgba(181,168,255,0)");
      x.fillStyle = gl; x.beginPath(); x.arc(px, py, R * 1.8, 0, 7); x.fill();
      x.fillStyle = dead ? "#ff6b7a" : "#ece8ff"; x.beginPath(); x.arc(px, py, R * .7, 0, 7); x.fill();
      if (!started) label(x, tr("光に指をのせるとスタート", "Touch the light to start"), W / 2, H - 30, 15, CC.muted);
    });
  },
});

/* ---------- 10 リングタップ ---------- */
game({
  id: "ring", name: tr("リングタップ", "Ring Tap"), glyph: "◎", color: "#ff8f6b",
  how: tr("外から縮んでくる輪が、まんなかの円に重なった瞬間にタップ！ピッタリほど高得点。40ノーツで勝負。", "Tap the moment the shrinking ring overlaps the circle. The closer, the higher the score. 40 notes."),
  fmt: s => s + tr("点", " pts"),
  ranks: [[11000, tr("リズム神", "Rhythm god")], [9000, tr("フルコン級", "Full combo class")], [7000, tr("うまい", "Skilled")], [5000, tr("いい感じ", "Nice")], [3000, tr("ふつう", "Average")], [0, tr("リズムは気持ち", "Rhythm is a feeling")]],
  play(c) {
    const { x, W, H } = c.canvas();
    const R = Math.min(W, H) * .085, TOTAL = 40;
    let notes = [], spawned = 0, score = 0, combo = 0, maxc = 0, nextAt = performance.now() + 800, judge = [], fin = false;
    const approach = () => Math.max(620, 1100 - spawned * 12);
    const upd = () => c.hud(tr(`コンボ <b>${combo}</b>`, `Combo <b>${combo}</b>`), tr(`<b>${score}</b> 点`, `<b>${score}</b> pts`));
    upd();
    const hitNote = (n, dtms) => {
      const a = Math.abs(dtms), j = a < 55 ? ["PERFECT", 300, "#ffd166"] : a < 110 ? ["GREAT", 150, "#5ee0b5"] : a < 180 ? ["GOOD", 60, "#7cc6ff"] : null;
      n.done = true;
      if (j) { combo++; maxc = Math.max(maxc, combo); score += Math.round(j[1] * (1 + Math.min(combo, 50) / 50)); c.sfx.ok(Math.min(combo, 20)); judge.push({ x: n.x, y: n.y, t: j[0], c: j[2], a: 1 }); }
      else { combo = 0; c.sfx.ng(); judge.push({ x: n.x, y: n.y, t: "MISS", c: "#ff6b7a", a: 1 }); }
      upd();
    };
    c.on(c.stage, "pointerdown", e => {
      e.preventDefault(); const [X, Y] = localXY(c, e), now = performance.now();
      const cand = notes.filter(n => !n.done && Math.hypot(X - n.x, Y - n.y) < R * 1.5).sort((a, b) => a.hit - b.hit)[0];
      if (cand) { const d = now - cand.hit; if (d > -260) hitNote(cand, d); }
    });
    c.loop(dt => {
      const now = performance.now();
      if (spawned < TOTAL && now >= nextAt) {
        const last = notes[notes.length - 1]; let nx, ny, k = 0;
        do { nx = rnd(R * 1.6, W - R * 1.6); ny = rnd(R * 1.8, H - R * 1.8); k++; } while (last && Math.hypot(nx - last.x, ny - last.y) < R * 2.6 && k < 30);
        notes.push({ x: nx, y: ny, born: now, hit: now + approach(), done: false, no: spawned + 1 }); spawned++;
        nextAt = now + Math.max(330, 760 - spawned * 11) * pick([1, 1, 1, .5, 1.5]);
      }
      notes.forEach(n => { if (!n.done && now - n.hit > 180) { n.done = true; combo = 0; judge.push({ x: n.x, y: n.y, t: "MISS", c: "#ff6b7a", a: 1 }); upd(); } });
      notes = notes.filter(n => !n.done || now - n.hit < 200);
      if (!fin && spawned >= TOTAL && notes.every(n => n.done)) { fin = true; c.after(600, () => c.end(score)); }
      x.fillStyle = CC.bg; x.fillRect(0, 0, W, H);
      notes.slice().reverse().forEach(n => {
        if (n.done) return;
        const p = clamp((n.hit - now) / (n.hit - n.born), 0, 1);
        x.strokeStyle = "rgba(255,143,107,.9)"; x.lineWidth = 3; x.beginPath(); x.arc(n.x, n.y, R * (1 + p * 2.2), 0, 7); x.stroke();
        x.fillStyle = "rgba(255,143,107,.25)"; x.beginPath(); x.arc(n.x, n.y, R, 0, 7); x.fill();
        x.strokeStyle = CC.ink; x.lineWidth = 3; x.stroke();
        label(x, n.no, n.x, n.y, Math.round(R * .7), CC.ink, "center", UFD);
      });
      judge = judge.filter(j => { j.a -= dt * 1.6; j.y -= dt * 30; if (j.a <= 0) return false; x.globalAlpha = j.a; label(x, j.t, j.x, j.y - R * 1.3, 16, j.c, "center", UFD); x.globalAlpha = 1; return true; });
      label(x, `${Math.min(spawned, TOTAL)} / ${TOTAL}`, W - 12, 16, 12, CC.muted, "right");
    });
  },
});

boot();
window.go = go; window.GAMES = GAMES; Object.defineProperty(window, "ctx", { get: () => ctx }); Object.defineProperty(window, "cur", { get: () => cur });
});
</script>
